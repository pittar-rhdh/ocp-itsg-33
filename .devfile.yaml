schemaVersion: 2.2.2
metadata:
  name: "ocp-itsg-33"
  provider: Andrew Pitt
  displayName: Basic Markdown Repo
  description: Basic Markdown Repo
  tags:
    - Markdown
    - AI
  projectType: Markdown
  language: Markdown
projects:
  - name: "ocp-itsg-33"
    git:
      remotes:
        origin: "https://github.com/pittar-rhdh/ocp-itsg-33"
      checkoutFrom:
        revision: "main"
        remote: origin
components:
  - name: tools
    container:
      image: quay.io/pittar/custom-udi-demo:latest
      args: ['tail', '-f', '/dev/null']
      cpuLimit: '2'
      cpuRequest: '0.2'
      memoryLimit: '4G'
      memoryRequest: '2G'
      mountSources: true
commands:
  - id: configure-opencode
    exec:
      component: tools
      commandLine: "mkdir -p /home/user/.config/opencode && cp /data/opencode/*.* /home/user/.config/opencode/"
events:
  postStart:
    - configure-opencode
