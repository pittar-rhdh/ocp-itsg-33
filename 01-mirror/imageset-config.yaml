# -----------------------------------------------------------------------------
# EXAMPLE — not validated.
#
# Example ImageSetConfiguration for oc-mirror v2. In this design it is the
# reviewed source of truth for WHAT is mirrored to the high side: the low side
# mirrors with it (mirror-to-disk) and the high side uploads with the same file
# (disk-to-mirror). Change it only through a reviewed pull request (CM-3).
#
# Package names, channels, and versions are examples: confirm each one against
# the live catalog before the first import. oc-mirror v2 does NOT add operator
# dependencies; list every package an operator needs.
# Guidance: docs/01-mirroring/imageset-configuration.md
# -----------------------------------------------------------------------------
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
# Maximum size of each archive file, in GiB. Uncomment to fit the transfer
# media (for example 3 for FAT32) and add --strict-archive to oc-mirror.
# archiveSize: 3
mirror:
  platform:
    architectures:
      - amd64
    channels:
      - name: stable-4.22
        type: ocp
        minVersion: '4.22.18'   # the version installed on the high side
        maxVersion: '4.22.18'   # the install or upgrade target
    graph: true                 # update graph data for OpenShift Update Service
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      packages:
        # Platform and bare-metal networking
        - name: cincinnati-operator
        - name: kubernetes-nmstate-operator
        - name: metallb-operator
        # GitOps, governance, and security (OpenShift Platform Plus)
        - name: openshift-gitops-operator
        - name: advanced-cluster-management
        - name: multicluster-engine
        - name: rhacs-operator
        # Security and compliance
        - name: compliance-operator
        - name: file-integrity-operator
        - name: security-profiles-operator
        - name: openshift-cert-manager-operator
        - name: openshift-external-secrets-operator
        # Observability
        - name: cluster-logging
        - name: loki-operator
        - name: cluster-observability-operator
        # Data protection
        - name: redhat-oadp-operator
    # Vendor CSI driver for the departmental enterprise storage (AD-13):
    # - catalog: registry.redhat.io/redhat/certified-operator-index:v4.22
    #   packages:
    #     - name: <vendor-csi-operator-package>
    #       channels:
    #         - name: <channel>
  additionalImages:
    # Use a full registry hostname; prefer @sha256 digests.
    - name: registry.redhat.io/rhel9/support-tools:latest   # oc debug / toolbox on RHCOS
    - name: registry.redhat.io/ubi9/ubi:latest
    - name: registry.redhat.io/ubi9/ubi-minimal:latest
