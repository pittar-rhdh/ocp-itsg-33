    policy.open-cluster-management.io/standards: ITSG-33
    policy.open-cluster-management.io/categories: RA Risk Assessment
    policy.open-cluster-management.io/controls: RA-5 Vulnerability Scanning
    policy.open-cluster-management.io/description: RHACS Central runs in offline mode.
    itsg33/controls: "RA-5,CA-7"
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: itsg33-ra-5-rhacs-offline
        spec:
          remediationAction: inform
