---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: itsg33-cm-7-mirrored-catalogs-only
  namespace: itsg33-policies
  annotations:
    policy.open-cluster-management.io/standards: ITSG-33
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-7 Least Functionality
    policy.open-cluster-management.io/description: The default (internet) operator catalogs are disabled.
    itsg33/controls: "CM-7,CA-7"
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: itsg33-cm-7-mirrored-catalogs-only
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OperatorHub
                metadata:
                  name: cluster
                spec:
                  disableAllDefaultSources: true
---
