---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: itsg33-ca-7-no-high-severity-failures
  namespace: itsg33-policies
  annotations:
    policy.open-cluster-management.io/standards: ITSG-33
    policy.open-cluster-management.io/categories: CA Security Assessment and Authorization
    policy.open-cluster-management.io/controls: CA-7 Continuous Monitoring
    policy.open-cluster-management.io/description: No high-severity Compliance Operator check is failing.
    itsg33/controls: "CA-7,CA-7"
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: itsg33-ca-7-no-high-severity-failures
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ComplianceCheckResult
                metadata:
                  namespace: openshift-compliance
                  labels:
                    compliance.openshift.io/check-status: FAIL
                    compliance.openshift.io/check-severity: high
