# One APIServer resource for every API server setting, so that a single file
# owns it: audit policy (AU), TLS profile (SC-8, SC-13), and etcd encryption
# (SC-28). Phase 3 (06-post-install.sh --configure) set the audit profile and
# encryption on Day 1; from now on Git owns them.
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  annotations:
    itsg33/controls: "AU-2,AU-3,AU-12,SC-8,SC-13,SC-28"
spec:
  audit:
    profile: WriteRequestBodies
    customRules:
      - group: system:authenticated:oauth   # Human users: also record read request bodies
        profile: AllRequestBodies
      - group: ocp-platform-admins
        profile: AllRequestBodies
  encryption:
    type: aesgcm                            # Re-encrypts etcd; check progress before other changes
  # Aligned to ITSP.40.062. TLS 1.3 suites are not configurable in Go components
  # and are always enabled when TLS 1.3 is negotiated. CHACHA20-POLY1305 is
  # left out because it is not FIPS-approved.
  tlsSecurityProfile:
    type: Custom
    custom:
      minTLSVersion: VersionTLS12
      ciphers:
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - ECDHE-ECDSA-AES128-GCM-SHA256
        - ECDHE-RSA-AES128-GCM-SHA256
        - ECDHE-ECDSA-AES256-GCM-SHA384
        - ECDHE-RSA-AES256-GCM-SHA384
