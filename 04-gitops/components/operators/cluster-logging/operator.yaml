# Logging Operator: collection and forwarding (same channel as loki-operator)
# Channel: confirm against the mirrored catalog with
#   01-mirror/03-list-operator-channels.sh cluster-logging
# The catalog source name is set for every Subscription by the cluster overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-logging
  annotations:
    itsg33/controls: "AU-2,AU-6,AU-9,AU-12"
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-logging
  namespace: openshift-logging
  annotations:
    itsg33/controls: "AU-2,AU-6,AU-9,AU-12"
spec:
  upgradeStrategy: Default                # AllNamespaces install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-logging
  annotations:
    itsg33/controls: "AU-2,AU-6,AU-9,AU-12"
spec:
  name: cluster-logging
  channel: stable-6.7
  installPlanApproval: Manual             # CM-3: every install and update is approved
  source: redhat-operators                # replaced by the overlay (oc-mirror catalog source)
  sourceNamespace: openshift-marketplace
