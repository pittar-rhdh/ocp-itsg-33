# Cluster Observability Operator: console log UI plugin and monitoring stacks
# Channel: confirm against the mirrored catalog with
#   oc get packagemanifest cluster-observability-operator -n openshift-marketplace \
#     -o jsonpath='{.status.channels[*].name}'
# The catalog source name is set for every Subscription by the cluster overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability-operator
  annotations:
    itsg33/controls: "AU-6,SI-4"
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  annotations:
    itsg33/controls: "AU-6,SI-4"
spec:
  upgradeStrategy: Default                # AllNamespaces install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  annotations:
    itsg33/controls: "AU-6,SI-4"
spec:
  name: cluster-observability-operator
  channel: stable
  installPlanApproval: Manual             # CM-3: every install and update is approved
  source: redhat-operators                # replaced by the overlay (oc-mirror catalog source)
  sourceNamespace: openshift-marketplace
