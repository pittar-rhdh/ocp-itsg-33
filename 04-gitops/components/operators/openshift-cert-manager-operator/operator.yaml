# cert-manager: certificates from the departmental PKI (install before External Secrets)
# Channel: confirm against the mirrored catalog with
#   01-mirror/03-list-operator-channels.sh openshift-cert-manager-operator
# The catalog source name is set for every Subscription by the cluster overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
  annotations:
    itsg33/controls: "IA-5,SC-12,SC-17"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    itsg33/controls: "IA-5,SC-12,SC-17"
spec:
  upgradeStrategy: Default                # AllNamespaces install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    itsg33/controls: "IA-5,SC-12,SC-17"
spec:
  name: openshift-cert-manager-operator
  channel: stable-v1
  installPlanApproval: Manual             # CM-3: every install and update is approved
  source: redhat-operators                # replaced by the overlay (oc-mirror catalog source)
  sourceNamespace: openshift-marketplace
