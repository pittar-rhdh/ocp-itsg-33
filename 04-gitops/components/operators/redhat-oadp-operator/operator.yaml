# OADP: backup and restore to departmental S3
# Channel: confirm against the mirrored catalog with
#   oc get packagemanifest redhat-oadp-operator -n openshift-marketplace \
#     -o jsonpath='{.status.channels[*].name}'
# The catalog source name is set for every Subscription by the cluster overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-adp
  annotations:
    itsg33/controls: "CP-9,CP-10"
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-adp
  namespace: openshift-adp
  annotations:
    itsg33/controls: "CP-9,CP-10"
spec:
  targetNamespaces:
    - openshift-adp
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: redhat-oadp-operator
  namespace: openshift-adp
  annotations:
    itsg33/controls: "CP-9,CP-10"
spec:
  name: redhat-oadp-operator
  channel: stable
  installPlanApproval: Manual             # CM-3: every install and update is approved
  source: redhat-operators                # replaced by the overlay (oc-mirror catalog source)
  sourceNamespace: openshift-marketplace
