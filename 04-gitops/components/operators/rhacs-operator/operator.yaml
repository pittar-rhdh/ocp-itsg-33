# Advanced Cluster Security operator (Central and SecuredCluster)
# Channel: confirm against the mirrored catalog with
#   oc get packagemanifest rhacs-operator -n openshift-marketplace \
#     -o jsonpath='{.status.channels[*].name}'
# The catalog source name is set for every Subscription by the cluster overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  annotations:
    itsg33/controls: "RA-5,SI-3,SI-4,CM-7"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  annotations:
    itsg33/controls: "RA-5,SI-3,SI-4,CM-7"
spec:
  upgradeStrategy: Default                # AllNamespaces install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  annotations:
    itsg33/controls: "RA-5,SI-3,SI-4,CM-7"
spec:
  name: rhacs-operator
  channel: stable
  installPlanApproval: Manual             # CM-3: every install and update is approved
  source: redhat-operators                # replaced by the overlay (oc-mirror catalog source)
  sourceNamespace: openshift-marketplace
