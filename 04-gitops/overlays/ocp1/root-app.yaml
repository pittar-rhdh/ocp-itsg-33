# Root ("app of apps") Application for cluster ocp1. Applied once by hand
# during the bootstrap; everything else comes from Git.
# Set repoURL to the departmental Git URL of this repository and keep it the
# same in apps/kustomization.yaml and gitops/kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: itsg33-root
  namespace: openshift-gitops
  annotations:
    itsg33/controls: "CM-2,CM-3,CM-5"
spec:
  project: default
  source:
    repoURL: https://git.example.gc.ca/platform/ocp-itsg-33.git
    targetRevision: main
    path: 04-gitops/overlays/ocp1/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true          # child Applications only
      selfHeal: true
